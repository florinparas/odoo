{% extends "base.html" %}
{% block title %}{{ 'Edit' if lead else 'New' }} Lead - CRM{% endblock %}
{% block content %}
<div class="o-control-panel">
    <h2><i class="bi bi-funnel"></i> {{ 'Edit' if lead else 'New' }} Lead</h2>
    <div class="o-cp-actions">
        <a href="{{ url_for('crm.pipeline') }}" class="btn btn-sm btn-odoo-outline">Cancel</a>
        {% if lead %}
        <form method="POST" action="{{ url_for('crm.lead_delete', id=lead.id) }}" style="display:inline;"
              onsubmit="return confirm('Delete this lead?');">
            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
        </form>
        {% endif %}
    </div>
</div>
<div class="o-content">
    <form method="POST" class="o-form">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">Lead Name *</label>
                <input type="text" name="name" class="form-control" value="{{ lead.name if lead else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Stage</label>
                <select name="stage" class="form-select">
                    {% for code, label in stages %}
                    <option value="{{ code }}" {{ 'selected' if lead and lead.stage == code }}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Contact</label>
                <select name="contact_id" class="form-select">
                    <option value="">— None —</option>
                    {% for c in contacts %}
                    <option value="{{ c.id }}" {{ 'selected' if lead and lead.contact_id == c.id }}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ lead.email if lead else '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ lead.phone if lead else '' }}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Expected Revenue</label>
                <input type="number" name="expected_revenue" class="form-control" step="0.01"
                       value="{{ lead.expected_revenue if lead else '' }}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Probability (%)</label>
                <input type="number" name="probability" class="form-control" min="0" max="100"
                       value="{{ lead.probability if lead else 10 }}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Priority</label>
                <select name="priority" class="form-select">
                    <option value="0" {{ 'selected' if not lead or lead.priority == 0 }}>Normal</option>
                    <option value="1" {{ 'selected' if lead and lead.priority == 1 }}>High</option>
                    <option value="2" {{ 'selected' if lead and lead.priority == 2 }}>Very High</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Assigned To</label>
                <select name="assigned_to" class="form-select">
                    <option value="">— None —</option>
                    {% for u in users %}
                    <option value="{{ u.id }}" {{ 'selected' if lead and lead.assigned_to == u.id }}>{{ u.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Source</label>
                <input type="text" name="source" class="form-control" value="{{ lead.source if lead else '' }}">
            </div>
            <div class="col-12">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ lead.description if lead else '' }}</textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-odoo"><i class="bi bi-check-lg"></i> Save</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
