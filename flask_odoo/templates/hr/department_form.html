{% extends "base.html" %}
{% block title %}{{ 'Edit' if department else 'New' }} Department{% endblock %}
{% block content %}
<div class="o-control-panel">
    <h2><i class="bi bi-building"></i> {{ 'Edit' if department else 'New' }} Department</h2>
    <div class="o-cp-actions">
        <a href="{{ url_for('hr.departments') }}" class="btn btn-sm btn-odoo-outline">Cancel</a>
    </div>
</div>
<div class="o-content">
    <form method="POST" class="o-form">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Department Name *</label>
                <input type="text" name="name" class="form-control" value="{{ department.name if department else '' }}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Manager</label>
                <select name="manager_id" class="form-select">
                    <option value="">— None —</option>
                    {% for u in users %}
                    <option value="{{ u.id }}" {{ 'selected' if department and department.manager_id == u.id }}>{{ u.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Color</label>
                <input type="color" name="color" class="form-control form-control-color" value="{{ department.color if department else '#714B67' }}">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-odoo"><i class="bi bi-check-lg"></i> Save</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
