{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="o-control-panel">
    <h2><i class="bi bi-person-circle"></i> My Profile</h2>
    <div class="o-cp-actions">
        <a href="{{ url_for('settings.index') }}" class="btn btn-sm btn-odoo-outline">Back</a>
    </div>
</div>
<div class="o-content">
    <form method="POST" class="o-form">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ current_user.email }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">New Password (leave blank to keep current)</label>
                <input type="password" name="password" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-odoo"><i class="bi bi-check-lg"></i> Update Profile</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
