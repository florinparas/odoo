{% extends "base.html" %}
{% block title %}{{ 'Edit' if task else 'New' }} Task{% endblock %}
{% block content %}
<div class="o-control-panel">
    <h2><i class="bi bi-check2-square"></i> {{ 'Edit' if task else 'New' }} Task — {{ project.name }}</h2>
    <div class="o-cp-actions">
        <a href="{{ url_for('projects.project_board', id=project.id) }}" class="btn btn-sm btn-odoo-outline">Cancel</a>
    </div>
</div>
<div class="o-content">
    <form method="POST" class="o-form">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Task Name *</label>
                <input type="text" name="name" class="form-control" value="{{ task.name if task else '' }}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Stage</label>
                <select name="stage" class="form-select">
                    {% for code, label in stages %}
                    <option value="{{ code }}" {{ 'selected' if task and task.stage == code }}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Priority</label>
                <select name="priority" class="form-select">
                    <option value="0" {{ 'selected' if not task or task.priority == 0 }}>Normal</option>
                    <option value="1" {{ 'selected' if task and task.priority == 1 }}>High</option>
                    <option value="2" {{ 'selected' if task and task.priority == 2 }}>Urgent</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Assigned To</label>
                <select name="assigned_to" class="form-select">
                    <option value="">— Unassigned —</option>
                    {% for u in users %}
                    <option value="{{ u.id }}" {{ 'selected' if task and task.assigned_to == u.id }}>{{ u.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Planned Hours</label>
                <input type="number" name="hours_planned" class="form-control" step="0.5" value="{{ task.hours_planned if task else 0 }}">
            </div>
            {% if task %}
            <div class="col-md-4">
                <label class="form-label">Hours Spent</label>
                <input type="number" name="hours_spent" class="form-control" step="0.5" value="{{ task.hours_spent if task else 0 }}">
            </div>
            {% endif %}
            <div class="col-12">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ task.description if task else '' }}</textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-odoo"><i class="bi bi-check-lg"></i> Save</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
